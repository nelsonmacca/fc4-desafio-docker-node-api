# Ambiente de desenvolvimento: db -> migrate -> app (+ adminer, opcional)
# Todos os valores configuraveis vem do arquivo .env (copie .env.example).
#
# Hot reload:      docker compose watch        (ou: docker compose up --watch)
# Ferramentas:     docker compose --profile tools up -d   (sobe tambem o adminer)
name: flags-api

# Build compartilhado entre `migrate` e `app`: mesma imagem do estagio dev,
# sem implementacao paralela. O BuildKit reaproveita o cache entre os dois.
x-app-build: &app-build
  context: .
  target: dev

services:
  db:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_USER: ${DB_USER:?defina DB_USER no .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
      POSTGRES_DB: ${DB_NAME:?defina DB_NAME no .env}
      # O servidor escuta na mesma porta que a aplicacao usa para conectar.
      PGPORT: ${DB_PORT:?defina DB_PORT no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      # -h 127.0.0.1 forca TCP: o servidor temporario do initdb escuta apenas
      # em socket unix, entao o healthcheck so passa quando o servidor
      # definitivo estiver aceitando conexoes de rede.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  # One-shot: aplica as migracoes pendentes e termina com exit code 0.
  # Sem restart policy (padrao "no"), como deve ser para um job.
  migrate:
    build: *app-build
    image: flags-api:dev
    env_file: .env
    command: ["npm", "run", "db:migrate"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  app:
    build: *app-build
    image: flags-api:dev
    env_file: .env
    ports:
      - "${PORT:?defina PORT no .env}:${PORT}"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - backend
    # Hot reload nativo do Compose (sem bind mount de codigo-fonte).
    # Cada arquivo que o Dockerfile copia para a imagem tem uma regra aqui:
    develop:
      watch:
        # Codigo: copiado para dentro do container; o `tsx watch` (CMD do
        # estagio dev) percebe a mudanca e reinicia o processo. Sem rebuild.
        - action: sync
          path: ./src
          target: /app/src
        # Manifestos de dependencias: invalidam a camada `npm ci`, entao a
        # imagem precisa ser reconstruida e o container recriado.
        - action: rebuild
          path: ./package.json
        # package-lock.json tambem dispara rebuild: `npm ci` instala exatamente
        # o que esta no lock, e ele pode mudar sem alterar package.json
        # (ex.: `npm update` em dependencia transitiva, ou lock regenerado).
        - action: rebuild
          path: ./package-lock.json
        # tsconfig.json e lido pelo tsx apenas na inicializacao: basta copiar
        # e reiniciar o container (nao invalida camadas de dependencias).
        - action: sync+restart
          path: ./tsconfig.json
          target: /app/tsconfig.json

  # Ferramenta opcional (profile `tools`): interface web para o PostgreSQL.
  # Nao sobe no `docker compose up` normal; apenas com `--profile tools`.
  adminer:
    # Tag explicitamente versionada da imagem oficial (sem `latest`).
    # Verificada no Docker Hub em 2026-09-14: mesmo digest para o qual
    # `adminer:latest` aponta hoje.
    image: adminer:6.0.1-standalone
    profiles:
      - tools
    environment:
      # Pre-preenche o campo "Servidor" do login com host:porta do servico db
      # (o unico ajuste de conexao que a imagem oficial oferece via ambiente).
      # Usuario, senha e banco sao digitados na propria interface, com os
      # valores de DB_USER / DB_PASSWORD / DB_NAME do .env; nada de credencial
      # aqui.
      ADMINER_DEFAULT_SERVER: db:${DB_PORT:?defina DB_PORT no .env}
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

volumes:
  pgdata:

networks:
  backend:
    driver: bridge
